<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title> </title>
    <!-- GitHub Favicon -->
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/Raffamanch/DJI-Virtual-Fight/main/PNG.ico">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #a4caff; font-family: consolas; position: fixed; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; overflow: hidden; cursor: default; }
        canvas { width: 100%; height: 100%; display: block; }
        
        #osd-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 6; pointer-events: none;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            background: transparent;
        }
        #osd-overlay-canvas {
            display: block;
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #bottom-hud-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 12;
            pointer-events: auto;
        }
        .hud-control-btn {
            background: rgba(20, 25, 35, 0.85);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .hud-control-btn:hover { background: rgba(40, 50, 70, 0.95); }

        #rc-sticks-container {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
            z-index: 7;
            pointer-events: none;
        }
        .stick-box {
            width: 110px;
            height: 110px;
            background: rgba(25, 28, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .stick-cross-h {
            position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(255, 255, 255, 0.25);
        }
        .stick-cross-v {
            position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: rgba(255, 255, 255, 0.25);
        }
        .stick-ball {
            position: absolute; width: 18px; height: 18px; background: #ffffff; border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 2px 6px rgba(0,0,0,0.6); z-index: 3;
        }
        .stick-trail {
            position: absolute; width: 14px; height: 14px; background: rgba(135, 206, 250, 0.65); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 2;
        }

        #touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9;
            pointer-events: none;
            display: none;
        }
        .touch-pad {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 30px);
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }
        #touch-left-pad { left: 20px; bottom: 60px; }
        #touch-right-pad { right: 20px; bottom: 60px; }
        
        .touch-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #top-action-bar {
            position: absolute; top: max(15px, env(safe-area-inset-top)); right: 20px; display: flex; align-items: center; gap: 10px; z-index: 8; pointer-events: auto;
        }
        .top-btn {
            background: rgba(20, 25, 35, 0.7); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px; border-radius: 6px; font-family: consolas; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .top-btn:hover { background: rgba(40, 50, 70, 0.8); }
        .btn-icon { background: #ffffff; color: #111; font-size: 11px; font-weight: bold; padding: 1px 5px; border-radius: 4px; }

        #top-menu-bar { position: absolute; top: max(15px, env(safe-area-inset-top)); left: 20px; display: flex; align-items: center; gap: 10px; z-index: 8; pointer-events: auto; }
        
        #mobile-mode-btn {
            color: rgb(255, 235, 59); font-size: 14px; background: rgba(20, 25, 35, 0.85); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,235,59,0.4); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            display: none; font-weight: bold;
        }

        #instructions { position: absolute; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.2); color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; z-index: 20; }
        #menu-content { background: rgba(24, 34, 48, 0.95); padding: 25px 30px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: auto; max-width: 90%; }
        h1 { margin-bottom: 15px; font-size: 22px; letter-spacing: 1px; color: #ffeb3b; }
        p { font-size: 14px; color: #eee; line-height: 1.5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container">
        <div id="top-menu-bar">           
            <div id="mobile-mode-btn">MODE: NORMAL</div>
        </div>

        <div id="top-action-bar">
            <button class="top-btn" id="btn-switch-view">View <span class="btn-icon">C</span></button>
            <button class="top-btn" id="btn-retry">Reset <span class="btn-icon">R</span></button>
            <button class="top-btn" id="btn-pause">Pause <span class="btn-icon" id="pause-icon">ESC</span></button>
        </div>

        <div id="osd-container">
            <canvas id="osd-overlay-canvas"></canvas>
        </div>

        <!-- Bottom Center HUD: Motor Toggle Logo & Fullscreen Logo -->
        <div id="bottom-hud-bar">
            <button id="btn-motor-toggle" class="hud-control-btn" title="Toggle Motor">&#9881;</button>
            <button id="btn-fullscreen-toggle" class="hud-control-btn" title="Fullscreen">&#x26F6;</button>
        </div>

        <div id="rc-sticks-container">
            <div id="stick-box-left" class="stick-box">
                <div class="stick-cross-h"></div>
                <div class="stick-cross-v"></div>
                <div id="stick-left" class="stick-ball"></div>
            </div>
            <div id="stick-box-right" class="stick-box">
                <div class="stick-cross-h"></div>
                <div class="stick-cross-v"></div>
                <div id="stick-right" class="stick-ball"></div>
            </div>
        </div>

        <div id="touch-controls">
            <div id="touch-left-pad" class="touch-pad">
                <div id="touch-left-knob" class="touch-knob"></div>
            </div>
            <div id="touch-right-pad" class="touch-pad">
                <div id="touch-right-knob" class="touch-knob"></div>
            </div>
        </div>

        <div id="instructions">
            <div id="menu-content">
                <h1>DJI VIRTUAL FIGHT</h1>
                <p id="instruction-text">
                    <b>Click Anywhere to Start</b><br><br>
                    <b>Controls:</b><br>
                    • W / S: Throttle Up / Down<br>
                    • A / D: Yaw Left / Right<br>
                    • Mouse Move: Pitch & Roll (Cursor stays free at bottom)<br>
                    • M: Toggle Motors | 1-4: Change Flight Modes<br>
                    • C: Change View | R: Reset | ESC: Pause
                </p>
            </div>
        </div>
    </div>

    <script>
        const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if (isMobile) {
            document.getElementById('touch-controls').style.display = 'block';
            document.getElementById('mobile-mode-btn').style.display = 'block';
            document.getElementById('pause-icon').innerText = 'II';
            document.getElementById('instruction-text').innerHTML = `
                <b>Tap Anywhere to Start</b><br><br>
                • Left Joystick: Throttle & Yaw<br>
                • Right Joystick: Pitch & Roll<br>
                • Tap Mode Button to switch flight modes
            `;
        }

        const osdCanvas = document.getElementById('osd-overlay-canvas');
        const oCtx = osdCanvas.getContext('2d', { willReadFrequently: true });
        const osdImg = new Image();
        osdImg.src = 'hd.jpeg';

        let nativeImgWidth = 1280;
        let nativeImgHeight = 720;

        function resizeOSD() {
            if (osdImg.complete && osdImg.naturalWidth) {
                nativeImgWidth = osdImg.naturalWidth;
                nativeImgHeight = osdImg.naturalHeight;
            }
            osdCanvas.width = nativeImgWidth;
            osdCanvas.height = nativeImgHeight;
            if (osdImg.complete) {
                renderProcessedOSD();
            }
        }

        function renderProcessedOSD() {
            oCtx.clearRect(0, 0, osdCanvas.width, osdCanvas.height);
            oCtx.drawImage(osdImg, 0, 0, osdCanvas.width, osdCanvas.height);
            
            const imgData = oCtx.getImageData(0, 0, osdCanvas.width, osdCanvas.height);
            const data = imgData.data;
            const width = osdCanvas.width;
            const height = osdCanvas.height;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2];
                if (r < 55 && g < 55 && b < 55) {
                    data[i+3] = 0;
                } else {
                    let brightness = (r + g + b) / 3;
                    if (brightness > 60) {
                        data[i]   = Math.min(255, r * 1.2);
                        data[i+1] = Math.min(255, g * 1.2);
                        data[i+2] = Math.min(255, b * 1.2);
                        data[i+3] = 255;
                    } else {
                        data[i+3] = 0;
                    }
                }
            }

            const tempData = new Uint8ClampedArray(data);
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    let idx = (y * width + x) * 4;
                    if (data[idx + 3] === 0) {
                        let solidNeighbors = 0;
                        if (tempData[((y-1) * width + x) * 4 + 3] > 128) solidNeighbors++;
                        if (tempData[((y+1) * width + x) * 4 + 3] > 128) solidNeighbors++;
                        if (tempData[(y * width + (x-1)) * 4 + 3] > 128) solidNeighbors++;
                        if (tempData[(y * width + (x+1)) * 4 + 3] > 128) solidNeighbors++;
                        if (solidNeighbors === 0) {
                            data[idx + 3] = 0;
                        }
                    }
                }
            }

            oCtx.putImageData(imgData, 0, 0);
        }

        osdImg.onload = () => { resizeOSD(); };

        const container = document.getElementById('canvas-container');
        const inst = document.getElementById('instructions');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa4caff);
        scene.fog = new THREE.FogExp2(0xbcd6ff, 0.0018);

        const camera = new THREE.PerspectiveCamera(120, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
        container.appendChild(renderer.domElement);

        function handleResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
            resizeOSD();
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(handleResize, 300);
        });

        setTimeout(handleResize, 100);

        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const skyLight = new THREE.DirectionalLight(0xfffae0, 0.6);
        skyLight.position.set(100, 300, 50);
        scene.add(skyLight);

        const floorCanvas = document.createElement('canvas');
        floorCanvas.width = 256; floorCanvas.height = 256;
        const ctxFloor = floorCanvas.getContext('2d');
        ctxFloor.fillStyle = '#4d7c3d'; ctxFloor.fillRect(0, 0, 256, 256);
        for(let i=0; i<800; i++) {
            ctxFloor.fillStyle = i % 2 === 0 ? '#568a44' : '#457037';
            ctxFloor.fillRect(Math.random()*256, Math.random()*256, 3, 3);
        }
        const floorTex = new THREE.CanvasTexture(floorCanvas);
        floorTex.wrapS = THREE.RepeatWrapping; floorTex.wrapT = THREE.RepeatWrapping;
        floorTex.repeat.set(180, 180);

        const floorGeo = new THREE.PlaneGeometry(5000, 5000);
        floorGeo.rotateX(-Math.PI / 2);
        const floorMat = new THREE.MeshBasicMaterial({ map: floorTex });
        scene.add(new THREE.Mesh(floorGeo, floorMat));

        const shadowCanvas = document.createElement('canvas');
        shadowCanvas.width = 64; shadowCanvas.height = 64;
        const sCtx = shadowCanvas.getContext('2d');
        const sGrad = sCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
        sGrad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
        sGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        sCtx.fillStyle = sGrad;
        sCtx.fillRect(0, 0, 64, 64);
        const shadowTex = new THREE.CanvasTexture(shadowCanvas);
        
        const droneShadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });
        const droneShadowGeo = new THREE.PlaneGeometry(3.2, 3.2);
        droneShadowGeo.rotateX(-Math.PI / 2);
        const droneShadow = new THREE.Mesh(droneShadowGeo, droneShadowMat);
        droneShadow.position.y = 0.02;
        scene.add(droneShadow);

        const cloudGroup = new THREE.Group();
        const cloudCanvas = document.createElement('canvas');
        cloudCanvas.width = 128; cloudCanvas.height = 128;
        const ctxCloud = cloudCanvas.getContext('2d');
        let grad = ctxCloud.createRadialGradient(64,64,10, 64,64,55);
        grad.addColorStop(0, 'rgba(255,255,255,0.85)');
        grad.addColorStop(0.4, 'rgba(240,245,255,0.6)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctxCloud.fillStyle = grad; ctxCloud.fillRect(0,0,128,128);
        const cloudTex = new THREE.CanvasTexture(cloudCanvas);

        const cloudSpriteMat = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: 0.6 });
        for(let c=0; c<45; c++) {
            const sprite = new THREE.Sprite(cloudSpriteMat);
            sprite.position.set((Math.random()-0.5)*1200, 180 + Math.random()*70, (Math.random()-0.5)*1200);
            sprite.scale.set(120 + Math.random()*100, 50 + Math.random()*40, 1);
            cloudGroup.add(sprite);
        }
        scene.add(cloudGroup);

        const obstacles = [];
        const blockCanvas = document.createElement('canvas');
        blockCanvas.width = 64; blockCanvas.height = 64;
        const ctxBlock = blockCanvas.getContext('2d');
        ctxBlock.fillStyle = '#6e7a8a'; ctxBlock.fillRect(0,0,64,64);
        ctxBlock.fillStyle = '#7a8899'; ctxBlock.fillRect(2,2,60,60);
        const blockTex = new THREE.CanvasTexture(blockCanvas);
        blockTex.wrapS = THREE.RepeatWrapping; blockTex.wrapT = THREE.RepeatWrapping;
        blockTex.repeat.set(2, 8);

        const wallMat = new THREE.MeshBasicMaterial({ map: blockTex });
        const gateMat = new THREE.MeshBasicMaterial({ color: 0xff1144 });

        function createTrackTower(x, z, width, height, depth) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), wallMat);
            mesh.position.set(x, height / 2, z);
            scene.add(mesh);
            obstacles.push({ minX: x - width/2, maxX: x + width/2, minZ: z - depth/2, maxZ: z + depth/2, minY: 0, maxY: height });
        }

        function createVelociGate(x, z, rotY) {
            const gateGroup = new THREE.Group(); const gateW = 15, gateH = 11, thick = 0.7;
            const top = new THREE.Mesh(new THREE.BoxGeometry(gateW, thick, thick), gateMat); top.position.y = gateH;
            const left = new THREE.Mesh(new THREE.BoxGeometry(thick, gateH, thick), gateMat); left.position.set(-gateW/2, gateH/2, 0);
            const right = new THREE.Mesh(new THREE.BoxGeometry(thick, gateH, thick), gateMat); right.position.set(gateW/2, gateH/2, 0);
            gateGroup.add(top, left, right); gateGroup.position.set(x, 0, z); gateGroup.rotation.y = rotY; scene.add(gateGroup);

            const isRotated = Math.abs(rotY) > 0.1; const sizeX = isRotated ? thick : gateW; const sizeZ = isRotated ? gateW : thick;
            const lx = x + (isRotated ? 0 : -gateW/2); const lz = z + (isRotated ? -gateW/2 : 0);
            obstacles.push({ minX: lx - 0.5, maxX: lx + 0.5, minZ: lz - 0.5, maxZ: lz + 0.5, minY: 0, maxY: gateH });
            const rx = x + (isRotated ? 0 : gateW/2); const rz = z + (isRotated ? gateW/2 : 0);
            obstacles.push({ minX: rx - 0.5, maxX: rx + 0.5, minZ: rz - 0.5, maxZ: rz + 0.5, minY: 0, maxY: gateH });
            obstacles.push({ minX: x - sizeX/2, maxX: x + sizeX/2, minZ: z - sizeZ/2, maxZ: z + sizeZ/2, minY: gateH - 0.4, maxY: gateH + 0.4 });
        }

        createTrackTower(-60, -100, 30, 70, 30);
        createTrackTower(70, -120, 35, 90, 35);
        createTrackTower(-90, 20, 25, 55, 25);
        createTrackTower(80, 40, 30, 65, 30);

        createVelociGate(0, -20, 0);
        createVelociGate(-35, -60, Math.PI / 4);
        createVelociGate(35, -60, -Math.PI / 4);
        createVelociGate(0, -120, 0);
        createVelociGate(-50, -170, Math.PI / 2);
        createVelociGate(50, -170, Math.PI / 2);
        createVelociGate(0, -240, 0);

        const droneGroup = new THREE.Group();
        
        const bodyMat = new THREE.MeshBasicMaterial({ color: 0x1c1e22 });
        const accentMat = new THREE.MeshBasicMaterial({ color: 0x2e323b });
        const orangeAccent = new THREE.MeshBasicMaterial({ color: 0xff6600 });
        const glassLensMat = new THREE.MeshBasicMaterial({ color: 0x112244 });

        const fuselage = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.35, 1.6), bodyMat);
        fuselage.position.set(0, 0, 0);
        droneGroup.add(fuselage);

        const ductMaterial = new THREE.MeshBasicMaterial({ color: 0x22252b, side: THREE.DoubleSide });
        const propMat = new THREE.MeshBasicMaterial({ color: 0xcccccc });

        const propMeshes = [];
        const ductPositions = [
            { x: 0.95, z: 0.85 },   
            { x: -0.95, z: 0.85 },  
            { x: 0.95, z: -0.85 },  
            { x: -0.95, z: -0.85 }   
        ];

        ductPositions.forEach(pos => {
            const ductGeo = new THREE.CylinderGeometry(0.85, 0.85, 0.4, 24, 1, true);
            const duct = new THREE.Mesh(ductGeo, ductMaterial);
            duct.position.set(pos.x, 0, pos.z);
            droneGroup.add(duct);

            const ringGeo = new THREE.TorusGeometry(0.86, 0.04, 8, 24);
            const ring = new THREE.Mesh(ringGeo, orangeAccent);
            ring.rotation.x = Math.PI / 2;
            ring.position.set(pos.x, 0, pos.z);
            droneGroup.add(ring);

            const prop = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.03, 0.18), propMat);
            prop.position.set(pos.x, 0, pos.z);
            droneGroup.add(prop);
            propMeshes.push(prop);
        });

        const gimbalHousing = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.35, 0.45), accentMat);
        gimbalHousing.position.set(0, -0.05, 0.95);
        droneGroup.add(gimbalHousing);

        const cameraLens = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.1, 16), glassLensMat);
        cameraLens.rotation.x = Math.PI / 2;
        cameraLens.position.set(0, -0.05, 1.2);
        droneGroup.add(cameraLens);

        scene.add(droneGroup);

        const drone = {
            position: new THREE.Vector3(0, 0.3, 45), 
            velocity: new THREE.Vector3(0, 0, 0),
            rotation: new THREE.Quaternion(),
            euler: new THREE.Euler(0, 0, 0, 'YXZ')
        };

        const MODES = {
            1: { name: "NORMAL", maxThrust: 14.0, drag: 0.040, hasAutoLevel: true, maxAngle: 0.5 },
            2: { name: "SPORT",  maxThrust: 21.0, drag: 0.025, hasAutoLevel: true, maxAngle: 0.8 },
            3: { name: "MANUAL", maxThrust: 25.5, drag: 0.022, hasAutoLevel: false },
            4: { name: "ACRO",   maxThrust: 25.5, drag: 0.009, hasAutoLevel: false }
        };
        let activeMode = 1;
        let cameraMode = "FPV";
        let isArmed = false;

        let tumbleRotationVelocity = new THREE.Vector3(0, 0, 0);
        let isSpawnedSafe = true; 

        let keys = { w: false, s: false, a: false, d: false };
        
        let targetMousePitch = 0;
        let targetMouseRoll = 0;
        let visualMouseX = 0;
        let visualMouseY = 0;

        let touchLeftValX = 0, touchLeftValY = 1.0; 
        let touchRightValX = 0, touchRightValY = 0;

        let stickyThrottleValue = 0.0; 

        const MOUSE_SENSITIVITY_SCALE = 0.8; 
        const THROTTLE_CHANGE_SPEED = 0.8; 
        const YAW_RATE = 3.5;
        const GRAVITY = 9.81;
        
        const CAMERA_UPTILT = 30 * (Math.PI / 180);
        let currentThrottle = 0;

        let mouseControlActive = false;

        // Stick trail history buffers
        const leftTrailHistory = [];
        const rightTrailHistory = [];
        const MAX_TRAIL_POINTS = 6;

        const motorBtn = document.getElementById('btn-motor-toggle');
        function toggleMotors() {
            if (!isArmed) {
                const modeCfg = MODES[activeMode];
                if (!modeCfg.hasAutoLevel && currentThrottle > 0.05) {
                    return;
                }
                isArmed = true;
            } else {
                isArmed = false;
                currentThrottle = 0;
                stickyThrottleValue = 0;
            }
        }
        motorBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMotors();
        });

        const fullscreenBtn = document.getElementById('btn-fullscreen-toggle');
        fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });

        function startGameSession() {
            handleResize();
            inst.style.display = 'none';
            mouseControlActive = true;
        }
        container.addEventListener('click', startGameSession);
        inst.addEventListener('click', startGameSession);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                mouseControlActive = false;
                inst.style.display = 'flex';
                e.preventDefault();
                return;
            }
            if (e.key.toLowerCase() === 'm') {
                toggleMotors();
                return;
            }
            if (['1','2','3','4'].includes(e.key)) {
                activeMode = parseInt(e.key);
                updateMobileModeButtonText();
                return;
            }
            if (e.key.toLowerCase() === 'c') { cameraMode = (cameraMode === "FPV") ? "TPV" : "FPV"; return; }
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
            if (key === 'r') resetDrone();
        });
        document.addEventListener('keyup', (e) => { const key = e.key.toLowerCase(); if (key in keys) keys[key] = false; });
        
        document.addEventListener('mousemove', (e) => {
            if (isMobile || !mouseControlActive) return;

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            const normX = (e.clientX - centerX) / centerX;
            const normY = (e.clientY - centerY) / centerY;

            targetMouseRoll = normX * MOUSE_SENSITIVITY_SCALE;
            targetMousePitch = -normY * MOUSE_SENSITIVITY_SCALE;

            // Position scaled to fit nicely within the 110px stick box bounds (~max 38px offset from center)
            visualMouseX = THREE.MathUtils.clamp((e.clientX - centerX) * 0.12, -38, 38);
            visualMouseY = THREE.MathUtils.clamp((e.clientY - centerY) * 0.12, -38, 38);
        });

        function updateMobileModeButtonText() {
            const btn = document.getElementById('mobile-mode-btn');
            if (btn) {
                btn.innerText = `MODE: ${MODES[activeMode].name}`;
            }
        }

        document.getElementById('mobile-mode-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            activeMode = (activeMode % 4) + 1;
            updateMobileModeButtonText();
        });

        function setupTouchJoystick(padId, knobId, callback, isStickyY = false) {
            const pad = document.getElementById(padId);
            const knob = document.getElementById(knobId);
            const maxDist = 45;
            let activeTouchId = null;

            pad.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (activeTouchId === null) {
                    const touch = e.changedTouches[0];
                    activeTouchId = touch.identifier;
                    updateStick(touch);
                }
            }, { passive: false });

            pad.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === activeTouchId) {
                        updateStick(touch);
                    }
                }
            }, { passive: false });

            function endTouch(e) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        activeTouchId = null;
                        if (!isStickyY) {
                            knob.style.transform = `translate(-50%, -50%)`;
                            callback(0, 0);
                        } else {
                            callback(0, null);
                        }
                    }
                }
            }
            pad.addEventListener('touchend', endTouch);
            pad.addEventListener('touchcancel', endTouch);

            function updateStick(touch) {
                const rect = pad.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                callback(dx / maxDist, dy / maxDist);
            }
        }

        if (isMobile) {
            const leftKnob = document.getElementById('touch-left-knob');
            if (leftKnob) {
                leftKnob.style.transform = `translate(-50%, calc(-50% + 45px))`;
            }

            setupTouchJoystick('touch-left-pad', 'touch-left-knob', (x, y) => {
                touchLeftValX = x;
                if (y !== null) touchLeftValY = y;
            }, true);
            setupTouchJoystick('touch-right-pad', 'touch-right-knob', (x, y) => {
                touchRightValX = x;
                touchRightValY = y;
            }, false);
        }

        document.getElementById('btn-switch-view').addEventListener('click', (e) => {
            e.stopPropagation();
            cameraMode = (cameraMode === "FPV") ? "TPV" : "FPV";
        });
        document.getElementById('btn-retry').addEventListener('click', (e) => {
            e.stopPropagation();
            resetDrone();
        });
        document.getElementById('btn-pause').addEventListener('click', (e) => {
            e.stopPropagation();
            mouseControlActive = false;
            inst.style.display = 'flex';
        });

        function resetDrone() {
            drone.position.set(0, 0.3, 45); drone.velocity.set(0, 0, 0); drone.rotation.set(0, 0, 0, 1); drone.euler.set(0, 0, 0);
            currentThrottle = 0; stickyThrottleValue = 0; tumbleRotationVelocity.set(0, 0, 0);
            isSpawnedSafe = true; targetMousePitch = 0; targetMouseRoll = 0; visualMouseX = 0; visualMouseY = 0;
            
            touchLeftValX = 0; 
            touchLeftValY = 1.0; 
            touchRightValX = 0; touchRightValY = 0;

            leftTrailHistory.length = 0;
            rightTrailHistory.length = 0;

            const leftKnob = document.getElementById('touch-left-knob');
            if(leftKnob) leftKnob.style.transform = 'translate(-50%, calc(-50% + 45px))';
            
            const rightKnob = document.getElementById('touch-right-knob');
            if(rightKnob) rightKnob.style.transform = 'translate(-50%, -50%)';

            handleResize();
        }

        function handleCollisions() {
            const px = drone.position.x; const py = drone.position.y; const pz = drone.position.z; 
            const buffer = 0.8; 

            for(let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                if(px + buffer > obs.minX && px - buffer < obs.maxX && pz + buffer > obs.minZ && pz - buffer < obs.maxZ) {
                    if(py + buffer > obs.minY && py - buffer < obs.maxY) {
                        let overlapX = Math.min(obs.maxX - (px - buffer), (px + buffer) - obs.minX);
                        let overlapZ = Math.min(obs.maxZ - (pz - buffer), (pz + buffer) - obs.minZ);
                        let speedH = Math.sqrt(drone.velocity.x * drone.velocity.x + drone.velocity.z * drone.velocity.z);

                        if (overlapX < overlapZ) {
                            drone.position.x += (px > (obs.minX + obs.maxX)/2) ? overlapX : -overlapX;
                            drone.velocity.x *= -0.4;
                        } else {
                            drone.position.z += (pz > (obs.minZ + obs.maxZ)/2) ? overlapZ : -overlapZ;
                            drone.velocity.z *= -0.4;
                        }

                        if (speedH > 4.5) {
                            tumbleRotationVelocity.set((Math.random() - 0.5) * 60.0, (Math.random() - 0.5) * 40.0, (Math.random() - 0.5) * 60.0);
                            drone.velocity.y = speedH * 0.45 + 2.5; 
                        } else {
                            drone.velocity.y = 2.8; 
                            tumbleRotationVelocity.set((Math.random()-0.5)*9, (Math.random()-0.5)*9, (Math.random()-0.5)*9);
                        }
                    }
                }
            }
        }

        function updateStickTrails(leftBox, rightBox, leftX, leftY, rightX, rightY) {
            // Remove previous trail DOM elements
            const oldTrails = leftBox.querySelectorAll('.stick-trail');
            oldTrails.forEach(t => t.remove());
            const oldRightTrails = rightBox.querySelectorAll('.stick-trail');
            oldRightTrails.forEach(t => t.remove());

            // Push current positions to history
            leftTrailHistory.unshift({ x: leftX, y: leftY });
            rightTrailHistory.unshift({ x: rightX, y: rightY });

            if (leftTrailHistory.length > MAX_TRAIL_POINTS) leftTrailHistory.pop();
            if (rightTrailHistory.length > MAX_TRAIL_POINTS) rightTrailHistory.pop();

            // Render left trails
            for (let i = 1; i < leftTrailHistory.length; i++) {
                const pt = leftTrailHistory[i];
                const trailEl = document.createElement('div');
                trailEl.className = 'stick-trail';
                trailEl.style.left = `calc(50% + ${pt.x}px)`;
                trailEl.style.top = `calc(50% + ${pt.y}px)`;
                trailEl.style.opacity = String(1 - (i / MAX_TRAIL_POINTS));
                leftBox.appendChild(trailEl);
            }

            // Render right trails
            for (let i = 1; i < rightTrailHistory.length; i++) {
                const pt = rightTrailHistory[i];
                const trailEl = document.createElement('div');
                trailEl.className = 'stick-trail';
                trailEl.style.left = `calc(50% + ${pt.x}px)`;
                trailEl.style.top = `calc(50% + ${pt.y}px)`;
                trailEl.style.opacity = String(1 - (i / MAX_TRAIL_POINTS));
                rightBox.appendChild(trailEl);
            }
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let dt = clock.getDelta(); if (dt > 0.1) dt = 0.1;
            const modeCfg = MODES[activeMode];

            let inputYaw = 0;
            let targetPitch = 0;
            let targetRoll = 0;

            if (!isArmed) {
                currentThrottle = 0;
                stickyThrottleValue = 0;
            } else {
                if (isMobile) {
                    stickyThrottleValue = THREE.MathUtils.clamp((-touchLeftValY + 1) / 2, 0, 1);
                    currentThrottle = stickyThrottleValue;
                } else {
                    if (keys.w) stickyThrottleValue = Math.min(1.0, stickyThrottleValue + THROTTLE_CHANGE_SPEED * dt);
                    if (keys.s) stickyThrottleValue = Math.max(0.0, stickyThrottleValue - THROTTLE_CHANGE_SPEED * dt);
                    currentThrottle = stickyThrottleValue;
                }
            }

            if (isMobile) {
                inputYaw = touchLeftValX * YAW_RATE * dt;
                targetPitch = -touchRightValY * (modeCfg.hasAutoLevel ? modeCfg.maxAngle : 2.5);
                targetRoll = touchRightValX * (modeCfg.hasAutoLevel ? modeCfg.maxAngle : 2.5);

                drone.euler.y -= inputYaw;
                if (modeCfg.hasAutoLevel) {
                    drone.euler.x = targetPitch;
                    drone.euler.z = targetRoll;
                    drone.rotation.setFromEuler(drone.euler);
                } else {
                    const deltaRotation = new THREE.Quaternion().setFromEuler(new THREE.Euler(targetPitch * dt, -inputYaw, targetRoll * dt, 'YXZ'));
                    drone.rotation.multiply(deltaRotation).normalize();
                }
            } else {
                if (mouseControlActive) {
                    if (keys.a) inputYaw = -YAW_RATE * dt;
                    if (keys.d) inputYaw = YAW_RATE * dt;

                    drone.euler.y -= inputYaw;

                    if (modeCfg.hasAutoLevel) {
                        drone.euler.x = targetMousePitch * modeCfg.maxAngle;
                        drone.euler.z = -targetMouseRoll * modeCfg.maxAngle;
                        drone.rotation.setFromEuler(drone.euler);
                    } else {
                        const pitchRate = targetMousePitch * 15.0;
                        const rollRate = -targetMouseRoll * 15.0;
                        const deltaRotation = new THREE.Quaternion().setFromEuler(new THREE.Euler(pitchRate * dt, -inputYaw, rollRate * dt, 'YXZ'));
                        drone.rotation.multiply(deltaRotation).normalize();
                    }
                } else {
                    targetMousePitch *= Math.exp(-10.0 * dt);
                    targetMouseRoll *= Math.exp(-10.0 * dt);
                    visualMouseX *= Math.exp(-10.0 * dt);
                    visualMouseY *= Math.exp(-10.0 * dt);
                }
            }

            if (drone.position.y > 1.5) { isSpawnedSafe = false; }

            if (tumbleRotationVelocity.lengthSq() > 0.001) {
                const tumbleQuaternion = new THREE.Quaternion().setFromEuler(
                    new THREE.Euler(tumbleRotationVelocity.z * dt, tumbleRotationVelocity.y * dt, tumbleRotationVelocity.x * dt, 'YXZ')
                );
                drone.rotation.multiply(tumbleQuaternion).normalize();
                tumbleRotationVelocity.multiplyScalar(Math.exp(-2.4 * dt)); 
                if (modeCfg.hasAutoLevel && tumbleRotationVelocity.lengthSq() < 0.4) { 
                    drone.euler.setFromQuaternion(drone.rotation, 'YXZ'); 
                }
            }

            const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(drone.rotation);
            const thrust = localUp.multiplyScalar(currentThrottle * modeCfg.maxThrust);
            const gravityForce = new THREE.Vector3(0, -GRAVITY, 0);

            const accel = new THREE.Vector3().addVectors(thrust, gravityForce);
            drone.velocity.addScaledVector(drone.velocity, -modeCfg.drag);
            drone.velocity.addScaledVector(accel, dt);
            drone.position.addScaledVector(drone.velocity, dt);

            if (drone.position.y <= 0.3) {
                drone.position.y = 0.3; 
                drone.velocity.y = 0;
                drone.velocity.x *= 0.5; 
                drone.velocity.z *= 0.5;
                tumbleRotationVelocity.set(0, 0, 0);
                if (modeCfg.hasAutoLevel) {
                    drone.euler.x = 0; 
                    drone.euler.z = 0; 
                    drone.rotation.setFromEuler(drone.euler); 
                }
            }

            handleCollisions();

            droneGroup.position.copy(drone.position);
            droneGroup.quaternion.copy(drone.rotation);

            droneShadow.position.x = drone.position.x;
            droneShadow.position.z = drone.position.z;
            const heightFactor = Math.max(0.2, 1.0 - (drone.position.y / 25.0));
            const shadowScale = (3.2 * heightFactor);
            droneShadow.scale.set(shadowScale, shadowScale, 1);
            droneShadow.material.opacity = Math.max(0.05, 0.55 * heightFactor);

            if (isArmed && currentThrottle > 0.05) { propMeshes.forEach(prop => { prop.rotation.y += 0.55; }); }

            cloudGroup.children.forEach(c => {
                c.position.x += 1.5 * dt;
                if(c.position.x > 600) c.position.x = -600;
            });

            if (cameraMode === "FPV") {
                camera.position.copy(drone.position);
                const camRot = drone.rotation.clone();
                camRot.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), CAMERA_UPTILT));
                camera.quaternion.copy(camRot);
                droneGroup.visible = false;
            } else {
                droneGroup.visible = true;
                const backOffset = new THREE.Vector3(0, 2.5, 7.5).applyQuaternion(drone.rotation);
                camera.position.lerp(new THREE.Vector3().subVectors(drone.position, backOffset), 0.2);
                camera.lookAt(drone.position);
            }

            if (camera.position.y < 0.5) {
                camera.position.y = 0.5;
            }

            const stickLeft = document.getElementById('stick-left');
            const stickRight = document.getElementById('stick-right');
            const stickBoxLeft = document.getElementById('stick-box-left');
            const stickBoxRight = document.getElementById('stick-box-right');

            let leftY, leftX, rightX, rightY;

            if (isMobile) {
                leftY = touchLeftValY * 35;
                leftX = touchLeftValX * 35;
                rightX = touchRightValX * 35;
                rightY = touchRightValY * 35;
            } else {
                leftY = -(stickyThrottleValue * 2 - 1) * 35; 
                leftX = (keys.d ? 1 : (keys.a ? -1 : 0)) * 35;
                rightX = visualMouseX;
                rightY = visualMouseY;
            }
            stickLeft.style.transform = `translate(calc(-50% + ${leftX}px), calc(-50% + ${leftY}px))`;
            stickRight.style.transform = `translate(calc(-50% + ${rightX}px), calc(-50% + ${rightY}px))`;

            updateStickTrails(stickBoxLeft, stickBoxRight, leftX, leftY, rightX, rightY);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
