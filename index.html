<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRYP FPV</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: sans-serif;
        }
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }
        #alt-speed-hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-family: monospace;
            font-size: 14px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 4px;
            z-index: 5;
        }
        #rc-stick-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 4px solid #ffd700;
            background: rgba(28, 30, 34, 0.6);
            border-radius: 8px;
            z-index: 5;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Main Menu / Welcome Screen -->
    <div id="menu-screen">
        <div id="menu-content" style="text-align: center; color: white;">
            <h1>TRYP FPV</h1>
            <button id="btn-play" style="padding: 10px 28px; font-size: 16px; font-weight: bold; background: #ffeb3b; color: #1c1e22; border: none; border-radius: 4px; cursor: pointer;">Play</button>
        </div>
    </div>

    <!-- Bottom-Left Alt & Speed OSD (Replaced image) -->
    <div id="alt-speed-hud" class="hidden">
        ALT: <span id="alt-val">0.0</span> m | SPD: <span id="spd-val">0.0</span> km/h
    </div>

    <!-- RC Stick Overlay (Reduced blur, 4px gold border) -->
    <div id="rc-stick-overlay" class="hidden"></div>

    <script>
        function startGameSession() {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('alt-speed-hud').classList.remove('hidden');
            document.getElementById('rc-stick-overlay').classList.remove('hidden');
            // Initialize your simulator loop or application logic here
        }

        document.getElementById('btn-play').addEventListener('click', (e) => {
            e.stopPropagation();
            startGameSession();
        });
    </script>
</body>
</html>
